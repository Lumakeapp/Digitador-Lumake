name: Gerar Lumake Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run dist -- --win --ia32

      - uses: actions/upload-artifact@v4
        with:
          name: Lumake-Windows
          path: dist/*.exe
          if-no-files-found: error
